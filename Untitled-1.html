<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPEC 7 // VINTAGE SOUND LAB - NEO-PUNK EDITION</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#010402; --panel:#070d08; --metal1:#1a211c; --metal2:#0a0f0b; --metal3:#020403;
  --g:#00ff41; --g-dim:#008f25; --g-faint:#003b0f; --amber:#ffb000; --red:#ff3333;
  --glow:0 0 8px rgba(0,255,65,.8),0 0 20px rgba(0,255,65,.4);
  --glow-amber:0 0 10px rgba(255,176,0,.8);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#041207 0%,var(--bg) 80%);
  color:var(--g);font-family:'Share Tech Mono','Courier New',monospace;display:flex;justify-content:center;align-items:center;padding:14px}

.rack{width:100%;max-width:980px;position:relative;border-radius:12px;padding:18px;
  background:linear-gradient(135deg,var(--metal1),var(--metal2) 60%,var(--metal3));
  border:3px solid #2d382f;box-shadow:inset 0 0 0 2px #040805,0 25px 50px rgba(0,0,0,0.9),0 0 30px rgba(0,255,65,.05)}

/* Tornillos de Rack de Audio */
.screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8a958c,#151a16);box-shadow:inset 0 0 0 1px #000,0 2px 4px #000}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:#050705;transform:rotate(25deg)}
.s1{left:8px;top:8px}.s2{right:8px;top:8px}.s3{left:8px;bottom:8px}.s4{right:8px;bottom:8px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 8px 14px;border-bottom:2px dashed #18261b}
h1{margin:0;font-weight:400;font-size:clamp(24px,5vw,36px);letter-spacing:.16em;text-shadow:var(--glow);line-height:1}
h1 small{display:block;font-size:clamp(10px,2vw,12px);letter-spacing:.3em;color:var(--g-dim);text-shadow:none;margin-top:4px}

.panel-status{display:flex;gap:15px;align-items:center}
.status-group{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--g-dim)}
.led-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.led{width:10px;height:10px;border-radius:50%;background:#0a1a0e;border:1px solid #000;box-shadow:inset 0 0 2px #000}
.live .led-sig{background:var(--g);box-shadow:var(--glow)}
.live .status-txt{color:var(--g);text-shadow:0 0 5px var(--g)}

/* Pantalla CRT Neo-Punk */
.crt{position:relative;border-radius:10px;padding:12px;background:#000;border:4px solid #141c15;margin-top:14px;
  box-shadow:inset 0 0 50px rgba(0,255,65,.15),inset 0 0 0 2px #000,0 0 15px rgba(0,0,0,0.8);overflow:hidden}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0,rgba(0,0,0,.4) 1px,transparent 1px,transparent 3px)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.75) 100%)}
canvas{display:block;width:100%;height:clamp(200px,34vh,280px);filter:drop-shadow(0 0 4px rgba(0,255,65,.6))}
.osd{position:absolute;z-index:1;left:18px;top:14px;font-size:11px;color:var(--g-dim);letter-spacing:.12em}
.osd.r{left:auto;right:18px}

/* Controles y Botones Estilo Hardware */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
button{font:inherit;font-size:13px;letter-spacing:.12em;color:var(--g);cursor:pointer;padding:10px 16px;border-radius:3px;
  background:linear-gradient(#152217,#070f09);border:1px solid var(--g-dim);box-shadow:0 3px 0 #000,inset 0 1px 0 #2a3d2e;transition:all .1s}
button:hover{border-color:var(--g);box-shadow:0 3px 0 #000,var(--glow);text-shadow:0 0 5px var(--g)}
button:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #000}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.on{background:linear-gradient(#004411,#001a05);color:#fff;border-color:var(--g);box-shadow:inset 0 0 10px rgba(0,255,65,.5),var(--glow)}
button.warn.on{background:linear-gradient(#4a3200,#1a1100);border-color:var(--amber);color:var(--amber);box-shadow:inset 0 0 10px rgba(255,176,0,.4),var(--glow-amber)}

.msg{flex:1;min-width:220px;font-size:12px;color:var(--g-dim);min-height:1.2em;border-left:2px solid var(--g-dim);padding-left:8px}
.msg.err{color:var(--red);border-color:var(--red)}

/* Rack de Ecualización */
.eq{padding:14px 10px;border-radius:6px;background:linear-gradient(#040a05,#0a140b);border:1px solid #1a2d1e;box-shadow:inset 0 0 20px #000}
.eq-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;font-size:12px;color:var(--g-dim);letter-spacing:.1em}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.band{display:flex;flex-direction:column;align-items:center;gap:6px}
.scale{position:relative;display:flex;align-items:center;gap:4px}
.ticks{display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:9px;color:var(--g-dim);text-align:right;width:22px}

/* Sliders verticales estilo fader/perilla analógica */
input[type=range]{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:38px;height:150px;background:transparent;margin:0;cursor:ns-resize}
input[type=range]::-webkit-slider-runnable-track{width:6px;border-radius:3px;background:linear-gradient(90deg,#000,#162619,#000);border:1px solid #233b26;box-shadow:inset 0 0 5px #000}
input[type=range]::-moz-range-track{width:6px;border-radius:3px;background:#0a140b;border:1px solid #233b26}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:18px;margin-left:-14px;border-radius:2px;border:1px solid #000;
  background:linear-gradient(#738575 0,#3b4a3d 45%,#111a13 50%,#263328 100%);box-shadow:0 3px 5px #000,inset 0 1px 0 #9eb0a1;position:relative}
input[type=range]::-moz-range-thumb{width:32px;height:16px;border-radius:2px;border:1px solid #000;background:linear-gradient(#738575,#263328)}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 3px 6px #000,var(--glow);border-color:var(--g)}
input[type=range]:active::-webkit-slider-thumb{background:linear-gradient(#00ff41,#008f25)}

.val{font-size:12px;min-width:60px;text-align:center;padding:2px 4px;background:#000;border:1px solid var(--g-faint);border-radius:2px;text-shadow:0 0 5px var(--g)}
.name{font-size:12px;letter-spacing:.08em;margin-top:2px}
.hz{font-size:10px;color:var(--g-dim)}

footer{margin-top:12px;padding:0 4px;font-size:10px;color:var(--g-dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;letter-spacing:.05em}

@media (max-width:540px){.ticks{display:none}input[type=range]{width:30px}.val{min-width:48px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="rack" id="rack">
  <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
  <header>
    <h1>SPEC 7<small>VINTAGE SOUND LAB // NEO-PUNK EDITION</small></h1>
    <div class="panel-status">
      <div class="status-group">
        <span>ESTADO SISTEMA</span>
        <div class="led-row">
          <span class="led led-sig"></span>
          <span class="status-txt" id="stateTxt">STANDBY</span>
        </div>
      </div>
    </div>
  </header>

  <section class="crt" aria-label="Analizador de espectro CRT">
    <div class="osd" id="osdL">MODO: ESPECTRO + OSCILOSCOPIO</div>
    <div class="osd r" id="osdR">PEAK -∞ dB</div>
    <canvas id="scope" width="900" height="280"></canvas>
  </section>

  <div class="bar">
    <button id="btnCapture">CONECTAR PESTAÑA</button>
    <button id="btnStop" disabled>DESCONECTAR</button>
    <button id="btnMode">MODO: ESPECTRO</button>
    <button id="btnMon" class="warn" aria-pressed="false" title="Silencia el original y emite la señal procesada">MONITOR EQ: OFF</button>
    <span class="msg" id="msg">Selecciona una pestaña de audio (Spotify/YouTube) y marca "Compartir audio".</span>
  </div>

  <section class="eq" aria-label="Ecualizador gráfico de 5 bandas">
    <div class="eq-head"><span>// MÓDULO EQ PARAMÉTRICO (±12 dB)</span><button id="btnReset">RESET EQ</button></div>
    <div class="bands" id="bands"></div>
  </section>

  <footer><span>ARQUITECTURA: STREAM → EQ CASCADE → ANALYSER</span><span id="outTxt">BUS MONITOR: AISLADO</span></footer>
</main>

<script>
(() => {
  const BANDS = [
    {name:'SUB',  f:60,    type:'lowshelf'},
    {name:'BASS', f:250,   type:'peaking'},
    {name:'MID',  f:1000,  type:'peaking'},
    {name:'HIGH', f:4000,  type:'peaking'},
    {name:'AIR',  f:12000, type:'highshelf'}
  ];
  const $ = id => document.getElementById(id);
  const rack = $('rack'), msg = $('msg'), canvas =$('scope'), g = canvas.getContext('2d');
  let ctx = null, source = null, stream = null, analyser = null, filters = [], monitorOn = false, audible = false, running = false;
  let viewMode = 0; // 0: Espectro de barras + laterales, 1: Osciloscopio de onda
  const sliders = [], vals = [];

  // Construcción dinámica de bandas EQ
  const bandsEl = $('bands');
  BANDS.forEach((b, i) => {
    const el = document.createElement('div'); el.className = 'band';
    const fl = b.f >= 1000 ? (b.f / 1000) + ' kHz' : b.f + ' Hz';
    el.innerHTML = `<div class="val" id="v${i}">0.0 dB</div>
      <div class="scale"><div class="ticks"><span>+12</span><span>0</span><span>-12</span></div>
      <input type="range" min="-12" max="12" step="0.5" value="0" id="s${i}" aria-label="${b.name} ${fl}"></div>
      <div class="name">${b.name}</div><div class="hz">${fl}</div>`;
    bandsEl.appendChild(el);
    const s = el.querySelector('input'), v = el.querySelector('.val');
    sliders.push(s); vals.push(v);
    s.addEventListener('input', () => setGain(i, parseFloat(s.value)));
    s.addEventListener('dblclick', () => { s.value = 0; setGain(i, 0); });
  });

  function setGain(i, db) {
    vals[i].textContent = (db > 0 ? '+' : '') + db.toFixed(1) + ' dB';
    if (filters[i]) filters[i].gain.setTargetAtTime(db, ctx.currentTime, 0.015);
  }
  $('btnReset').onclick = () => sliders.forEach((s, i) => { s.value = 0; setGain(i, 0); });

  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

  // Control de Audio Web API
  async function start() {
    if (running) return;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({video: true, audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false, suppressLocalAudioPlayback: audible}});
    } catch (e) {
      say(e.name === 'NotAllowedError' ? 'Captura cancelada o bloqueada. Abre la página directamente en una pestaña.' : 'Error: ' + e.message, true);
      return;
    }
    if (!stream.getAudioTracks().length) {
      stream.getTracks().forEach(t => t.stop());
      say('No se detectó pista de audio. Asegúrate de marcar "Compartir audio de la pestaña".', true);
      return;
    }
    stream.getVideoTracks().forEach(t => t.stop()); 
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)({latencyHint:'interactive'});
    if (ctx.state === 'suspended') await ctx.resume();

    source = ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
    filters = BANDS.map((b, i) => {
      const f = ctx.createBiquadFilter();
      f.type = b.type; f.frequency.value = b.f; f.Q.value = b.type === 'peaking' ? 1.1 : 0.707;
      f.gain.value = parseFloat(sliders[i].value);
      return f;
    });
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.8;
    analyser.minDecibels = -90; analyser.maxDecibels = -10;

    // Enrutamiento seguro: Fuente → EQ Cascade → Analyser
    let node = source;
    filters.forEach(f => { node.connect(f); node = f; });
    node.connect(analyser);

    stream.getAudioTracks()[0].addEventListener('ended', stop);
    running = true;
    rack.classList.add('live'); $('stateTxt').textContent = 'EN LÍNEA';
    $('btnCapture').classList.add('on'); $('btnCapture').disabled = true; $('btnStop').disabled = false;
    
    const sup = stream.getAudioTracks()[0].getSettings().suppressLocalAudioPlayback === true;
    if (audible && sup) { analyser.connect(ctx.destination); monitorOn = true; setMonUI(); say('Monitoreo activo: señal ecualizada enrutada a salida.'); }
    else if (audible) { say('El navegador no pudo silenciar el origen; monitor desactivado para evitar eco.', true); }
    else { say('Capturando espectro. Audio original sonando en su pestaña sin retraso.'); }
  }

  function stop() {
    if (!running) return;
    running = false;
    try { analyser.disconnect(); } catch(e){}
    try { source.disconnect(); filters.forEach(f => f.disconnect()); } catch(e){}
    stream && stream.getTracks().forEach(t => t.stop());
    filters = []; analyser = null; source = null; stream = null; monitorOn = false;
    setMonUI();
    rack.classList.remove('live'); $('stateTxt').textContent = 'STANDBY';$('btnCapture').classList.remove('on'); $('btnCapture').disabled = false; $('btnStop').disabled = true;
    say('Sistema desconectado.');
  }

  function setMonUI() { 
    const b = $('btnMon'); 
    b.classList.toggle('on', audible); 
    b.setAttribute('aria-pressed', audible); 
    b.textContent = 'MONITOR EQ: ' + (audible ? 'ON' : 'OFF'); 
    $('outTxt').textContent = 'BUS MONITOR: ' + (monitorOn ? 'ACTIVO (EQ)' : 'AISLADO'); 
  }

  $('btnMon').onclick = () => {
    if (running) { say('Detén la captura antes de alternar el modo de monitoreo.', true); return; }
    if (!audible && !navigator.mediaDevices.getSupportedConstraints().suppressLocalAudioPlayback) { 
      say('Tu navegador no soporta supresión local directa (usa Chrome/Edge).', true); return; 
    }
    audible = !audible; setMonUI();
    say(audible ? 'Monitor activado: el audio original se silenciará y oirás el procesamiento EQ.' : 'Monitor desactivado: solo análisis visual.');
  };

  $('btnMode').onclick = () => {
    viewMode = (viewMode + 1) % 2;
    $('btnMode').textContent = viewMode === 0 ? 'MODO: ESPECTRO' : 'MODO: OSCILOSCOPIO';$('osdL').textContent = viewMode === 0 ? 'MODO: ESPECTRO DE BARRAS' : 'MODO: OSCILOSCOPIO DE ONDA';
  };

  $('btnCapture').onclick = start; 
  $('btnStop').onclick = stop;

  // Renderizado del Visualizador CRT con barras y osciloscopio
  const BARS = 52, SEG_H = 5, SEG_GAP = 2, peaks = new Float32Array(BARS), level = new Float32Array(BARS);
  function fit() {
    const r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d); g.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', fit); fit();

  let freqData = null, timeData = null, t0 = performance.now();
  function draw() {
    requestAnimationFrame(draw);
    const W = canvas.clientWidth, H = canvas.clientHeight;
    g.clearRect(0, 0, W, H);

    // Dibujar retícula de fondo estilo consola analógica
    g.strokeStyle = "rgba(0, 255, 65, 0.04)";
    g.lineWidth = 1;
    for (let x = 0; x < W; x += 30) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    for (let y = 0; y < H; y += 30) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }

    let peakDb = -Infinity;

    if (running && analyser) {
      if (!freqData || freqData.length !== analyser.frequencyBinCount) {
        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.frequencyBinCount);
      }
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      const nyq = ctx.sampleRate / 2, minF = 30, maxF = Math.min(16000, nyq);
      for (let i = 0; i < BARS; i++) {
        const f1 = minF * Math.pow(maxF / minF, i / BARS), f2 = minF * Math.pow(maxF / minF, (i + 1) / BARS);
        let a = Math.floor(f1 / nyq * freqData.length), b = Math.max(a + 1, Math.ceil(f2 / nyq * freqData.length)), m = 0;
        for (let k = a; k < b; k++) m = Math.max(m, freqData[k]);
        level[i] = m / 255;
      }
      const mx = Math.max(...level); peakDb = mx > 0 ? (20 * Math.log10(mx)).toFixed(1) : -Infinity;
    } else {
      const t = (performance.now() - t0) / 1000;
      for (let i = 0; i < BARS; i++) level[i] = 0.03 + 0.02 * (1 + Math.sin(t * 2 + i * 0.4));
    }

    if (viewMode === 0) {
      // MODO ESPECTRO DE BARRAS SEGMENTADAS CON LÍNEAS LATERALES Y PICO
      const pad = 12, bw = (W - pad * 2) / BARS, rows = Math.floor((H - 24) / (SEG_H + SEG_GAP));
      for (let i = 0; i < BARS; i++) {
        const lit = Math.round(level[i] * rows);
        if (lit > peaks[i]) peaks[i] = lit; else peaks[i] = Math.max(0, peaks[i] - 0.15);
        const x = pad + i * bw + 1, w = bw - 2;
        for (let r = 0; r < rows; r++) {
          const y = H - 16 - (r + 1) * (SEG_H + SEG_GAP) + SEG_GAP, p = r / rows;
          if (r < lit) {
            const l = 35 + p * 45;
            g.fillStyle = p > 0.85 ? '#ccffdd' : `hsl(${125 - p * 10},100%,${l}%)`;
          } else {
            g.fillStyle = 'rgba(0,255,65,.04)';
          }
          g.fillRect(x, y, w, SEG_H);
        }
        if (peaks[i] > 1) { 
          g.fillStyle = '#ffffff'; 
          g.fillRect(x, H - 16 - (Math.floor(peaks[i]) + 1) * (SEG_H + SEG_GAP) + SEG_GAP, w, 2); 
        }
      }
      // Marcas de frecuencia
      g.fillStyle = 'rgba(0,255,65,.6)'; g.font = '10px "Share Tech Mono",monospace';
      [['30Hz',0],['250Hz',.28],['1kHz',.54],['4kHz',.77],['16kHz',.95]].forEach(([t, p]) => {
        g.fillText(t, pad + p * (W - pad * 2) - 10, H - 4);
      });
    } else {
      // MODO OSCILOSCOPIO DE ONDA EN TIEMPO REAL
      g.lineWidth = 2;
      g.strokeStyle = '#00ff41';
      g.beginPath();
      const sliceWidth = W / (timeData ? timeData.length : 100);
      let x = 0;
      for (let i = 0; i < (timeData ? timeData.length : 100); i++) {
        const v = timeData ? timeData[i] / 128.0 : 1.0;
        const y = v * H / 2;
        if (i === 0) g.moveTo(x, y);
        else g.lineTo(x, y);
        x += sliceWidth;
      }
      g.lineTo(W, H / 2);
      g.stroke();
    }

    $('osdR').textContent = 'PEAK ' + (peakDb === -Infinity ? '-∞' : peakDb) + ' dB';
  }
  draw();
})();
</script>
</body>
</html>
